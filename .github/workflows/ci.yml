name: Build and package

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the frontend
        uses: actions/checkout@v7

      - name: Use Node 24.19.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Prove the train package can be assembled
        run: npm pack --dry-run

      - name: Run the unit suite
        env:
          CHROME_BIN: /usr/bin/google-chrome
          CEDAR_FRONTEND_BEHAVIOR: develop
          CEDAR_FRONTEND_TARGET: local
          CEDAR_FRONTEND_local_UI_HOST: metadatacenter.orgx
          CEDAR_FRONTEND_local_REST_HOST: metadatacenter.orgx
          CEDAR_VERSION: 0.0.0-ci
          CEDAR_VERSION_MODIFIER: ''
          CEDAR_DATACITE_ENABLED: 'false'
          CEDAR_GA4_TRACKING_ID: ''
        # The suite loads config/url-service.conf.json, which these tasks write from
        # their templates. The hosts above only have to parse; nothing here calls them.
        run: npx gulp replace-url replace-version && npm test
