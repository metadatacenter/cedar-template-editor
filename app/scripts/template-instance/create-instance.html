<section class="template-container scrollable-content">
  <div class="template-body metadata">
    <div class="container">
      <div class="row">
        <div class="right-body col-sm-16 c">
          <!-- The metadata's own name. It is stored beside the field values, and this is the only
               place on the page that shows it. The editor below holds the template's fields. -->
          <div class="instance-name-container" ng-hide="vm.loading">
            <!-- The label follows the input so the stylesheet can colour it from the input's state. -->
            <input type="text" class="form-control" id="instance-name"
                   ng-readonly="!vm.canEdit"
                   ng-model="vm.instanceName"
                   ng-change="vm.instanceNameChanged()">
            <label for="instance-name" translate>METADATAEDITOR.instanceName</label>
          </div>

          <section class="template-container">
            <cedar-embeddable-editor></cedar-embeddable-editor>
          </section>

          <div class="edit-actions cee-edit-actions" ng-hide="vm.loading">
            <div class="alert alert-warning cee-validation-report" role="alert" aria-live="polite"
                ng-if="vm.showValidationReport()">
              <strong>Metadata quality issues</strong>
              <p>This metadata can still be saved.</p>
              <p ng-if="vm.missingRequiredFieldCount > 0">{{vm.missingRequiredFieldMessage}}</p>
              <ul ng-if="vm.validationProblems.length > 0">
                <li ng-repeat="problem in vm.validationProblems track by $index">
                  <span class="cee-validation-path">{{vm.problemPath(problem)}}</span>
                  <span>{{problem.message || problem.code}}</span>
                </li>
              </ul>
            </div>
            <div ng-if="vm.canEdit" class="flex-right" style="width:95%;">
              <button type="button" id="button-cancel-metadata" class="btn btn-clear metadata"
                  ng-click="vm.cancel()" style="outline:none;" translate>GENERIC.Cancel
              </button>
              <button type="button" id="button-save-metadata" ng-disabled="vm.saveButtonDisabled"
                  class="btn btn-save metadata" ng-click="vm.save()" style="outline:none;" translate>GENERIC.Save
              </button>
            </div>
            <div ng-if="!vm.canEdit" class="alert alert-warning locked-notice" role="alert">
              <p><i class="fa fa-lock"></i>{{'TEMPLATEEDITOR.lock.noEditPermission' | translate}}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
