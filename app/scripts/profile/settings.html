<div id="settings">

  <div class="navbar-back flex" style="font-size: 16px;cursor: pointer;">
    <div class="back-arrow-click flex-left" style="margin-right: 10px;font-weight: 100;font-size: 18px;" ng-click="goToDashboardOrBack()">
      <i class="back-arrow fa fa-arrow-left"></i>
      <div class="document-title" style="margin-left: 10px;font-weight:normal">Settings</div>
    </div>
  </div>

  <div class="content">
    <div class="pf-card">
      <div class="pf-card__head">
        <h3 class="pf-card__title"><i class="fa fa-sliders"></i> Settings</h3>
      </div>

      <div class="pf-toggle-row">
        <div class="pf-toggle-row__text">
          <div class="pf-toggle-row__title">Test the new Metadata Editor UI</div>
          <div class="pf-toggle-row__desc">
            We are currently testing a beta UI for creating and editing instances. Switch it on to try it &mdash;
            you can switch back to the legacy UI at any time during this test phase.
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" ng-click="toggleMetadataEditorV2()" ng-model="useMetadataEditorV2">
          <span class="slider round"></span>
        </label>
      </div>
    </div>
  </div>

</div>
